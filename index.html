<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#02153b,#00112d,#031b4d);
overflow:hidden;position:relative}
.b{position:absolute;border-radius:50%;opacity:.25}
.b1{width:220px;height:220px;background:#1e5eff;left:-70px;bottom:-70px}
.b2{width:170px;height:170px;background:#ff7b29;right:-50px;top:-50px}
.b3{width:60px;height:60px;background:#ff7b29;left:80px;top:50%}
.b4{width:50px;height:50px;background:#1e5eff;left:20%;top:10%}
.b5{width:55px;height:55px;background:#ff7b29;right:12%;top:35%}
.card{
width:90%;max-width:580px;background:#fff;border-radius:20px;
padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.icon{
width:80px;height:80px;background:#f3f7ff;border-radius:50%;
display:flex;align-items:center;justify-content:center;
margin:0 auto 20px;font-size:38px}
h1{font-size:36px;color:#10204f;line-height:1.2}
.line{width:70px;height:4px;background:#ff7b29;border-radius:10px;margin:18px auto 24px}
p{font-size:18px;color:#667085;line-height:1.7}
.support{
margin-top:30px;padding-top:25px;border-top:1px solid #eee;
display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap}
.support div{font-size:18px;font-weight:600;color:#111827}
@media(max-width:600px){
h1{font-size:30px} p,.support div{font-size:16px}
}
</style>
</head>
<body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div><div class="b b4"></div><div class="b b5"></div>

<div class="card">
<div class="icon">⚙️</div>
<h1>Seller Panel Under Maintenance</h1>
<div class="line"></div>
<p>We're upgrading MySellerDesk to provide a better experience for all sellers.<br>Please check back shortly.</p>

<div class="support">
<div>📱 8122615305</div>
<div>✉️ support@mysellerdesk.in</div>
</div>
</div>
</body>
</html>
